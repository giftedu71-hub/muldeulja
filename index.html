    };
    const videoIds=['Gnirt72aX5s','91bytoQkBT8','Yw2dy0E9tAo','X1tZMOwvtV8'];let lastVideoIndex=-1;

    let points=Number(localStorage.getItem('muldeuljaPoints')||0);let done=new Set(JSON.parse(localStorage.getItem('muldeuljaDone')||'[]'));
    function show(id){if(id!=='content')clearInterval(timer);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='dashboard')update();if(id==='shopScreen')document.getElementById('shopPoints').textContent=points}
    function openContent(id){clearInterval(timer);current=id;seconds=0;videoConfirmed=false;const c=content[id];document.getElementById('body').innerHTML=`<div class="type">${c.type}</div><h2>${c.title}</h2>${c.body}`;document.getElementById('videoCheck').style.display=id==='video'?'block':'none';if(id==='video'){const chosen=videoIds[Math.floor(Math.random()*videoIds.length)];document.getElementById('videoFrame').src=`https://www.youtube-nocookie.com/embed/${chosen}?rel=0`;document.getElementById('youtubeLink').href=`https://www.youtube.com/watch?v=${chosen}`;document.getElementById('status').textContent='영상을 끝까지 본 뒤, “영상 끝까지 시청했어요”를 눌러 확인해 주세요.'}else if(id==='article'){readingStatus();timer=setInterval(()=>{seconds++;readingStatus();if(seconds>=30)clearInterval(timer)},1000)}else{document.getElementById('status').textContent='내용을 확인한 뒤 완료 버튼을 눌러 주세요.'}show('content')}

    function update(){document.getElementById('points').textContent=points}
    function buy(name,cost){if(points<cost){alert('포인트가 부족해요.');return}points-=cost;localStorage.setItem('muldeuljaPoints',points);alert(name+' 교환 완료!');show('shopScreen')}
    function showPoints(){show('historyScreen')}
    let pointHistory=JSON.parse(localStorage.getItem('muldeuljaHistory')||'[]');
    function saveHistory(){localStorage.setItem('muldeuljaHistory',JSON.stringify(pointHistory))}
    function renderHistory(){const box=document.querySelector('#historyScreen .product');box.innerHTML=pointHistory.length?pointHistory.map(x=>x).join('<br><br>'):'사용·적립 내역 없음';}

    function buy(name,cost){if(points<cost){alert('포인트가 부족해요.');return}points-=cost;pointHistory.unshift(`-${cost.toLocaleString()}P · ${name} 교환`);localStorage.setItem('muldeuljaPoints',points);saveHistory();alert(name+' 교환 완료!');show('shopScreen')}
