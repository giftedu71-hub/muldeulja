<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>물들자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--sky:#bce9ff;--blue:#1976d2;--navy:#073b67;--ink:#243746}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#ecfaff,var(--sky));color:var(--ink);font-family:'Gowun Dodum',sans-serif}button{border:0;font:inherit;cursor:pointer}.screen{display:none;min-height:100vh;padding:24px}.screen.active{display:flex}
    #home{align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.bubble{position:absolute;border-radius:50%;background:#ffffff73}.b1{width:85px;height:85px;top:13%;left:9%}.b2{width:48px;height:48px;right:12%;top:25%}.b3{width:65px;height:65px;right:8%;bottom:13%}.hero{position:relative}.wave{font-size:75px}h1,.brand,h2{font-family:Jua,sans-serif;color:var(--navy)}h1{font-size:clamp(60px,15vw,88px);margin:0}.tagline{font-size:18px;line-height:1.7;margin:18px 0 34px}.primary{background:var(--blue);color:#fff;border-radius:999px;padding:16px 34px;font-weight:bold;font-size:17px;box-shadow:0 6px 0 #0b559b}.primary:active{transform:translateY(5px);box-shadow:0 1px 0 #0b559b}
    #dashboard{max-width:900px;margin:auto;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:29px}.right-tools{display:flex;gap:7px}.points,.shop{padding:10px 13px;border-radius:14px;font-weight:bold;white-space:nowrap;box-shadow:0 4px 12px #073b6720}.points{background:white}.points i{color:#e9a600}.shop{background:#ffdc72;color:#594100}.welcome{margin:40px 0 18px}.welcome h2{font-size:29px;margin:0 0 9px}.welcome p{margin:0;line-height:1.65}.progress{background:#ffffffa8;padding:13px 15px;border-radius:15px;margin-bottom:22px;font-size:14px}.bar{height:9px;background:#d8e7ed;border-radius:8px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:linear-gradient(90deg,#27b6a7,#1976d2);width:0;transition:.3s}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{min-height:155px;border-radius:23px;padding:18px 14px;text-align:left;color:var(--ink);box-shadow:0 6px 15px #073b6720;position:relative}.card:hover{transform:translateY(-2px)}.card.done:after{content:'완료';position:absolute;right:11px;top:11px;background:#147b57;color:white;font-size:11px;padding:4px 8px;border-radius:10px}.video{background:#fff1c7}.article{background:#e0f5ff}.guide{background:#dcf6e9}.comic{background:#f4e2ff}.card i{font-size:31px;color:var(--navy);margin-bottom:17px}.card h3{margin:0 0 6px;font-size:18px}.card span{font-size:12px}
    #content,#shopScreen{align-items:center;justify-content:center}.box{width:min(100%,650px);background:white;border-radius:28px;padding:27px;box-shadow:0 12px 30px #073b6724}.back{background:#e7f3fa;color:var(--navy);padding:9px 12px;border-radius:12px;font-weight:bold}.type{color:var(--blue);font-weight:bold;margin-top:20px}.box h2{font-size:27px;margin:8px 0 16px}.text{background:#f4fbff;padding:17px;border-radius:16px;line-height:1.8}.tips{line-height:2;padding-left:22px}.youtube{aspect-ratio:16/9;background:#073b67;border-radius:17px;overflow:hidden;margin-bottom:15px}.youtube iframe{width:100%;height:100%;border:0}.notice{margin-top:17px;background:#e9f8f4;color:#075d4c;padding:13px;border-radius:14px;text-align:center;font-weight:bold}.external{display:block;text-align:center;margin-top:12px;color:#075ea3;font-weight:bold}.complete{width:100%;margin-top:18px;background:var(--blue);color:white;border-radius:14px;padding:14px;font-weight:bold}.verify{width:100%;margin-top:12px;padding:12px;background:#f1f7fa;color:#075182;border-radius:14px;font-weight:bold}.shop-box{text-align:center}.coin{font-size:70px}.product{margin-top:20px;text-align:left}.muted{font-size:13px;color:#5c7580}@media(min-width:650px){.screen{padding:36px}.menu{grid-template-columns:repeat(4,1fr)}.card{min-height:190px}}
  </style>
</head>
<body>
  <main>
    <section id="home" class="screen active"><span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><div class="hero"><div class="wave">🌊</div><h1>물들자</h1><p class="tagline">작은 친환경 실천이 모여<br>깨끗한 바다를 물들여요.</p><button class="primary" onclick="show('dashboard')">시작하기 <i class="fa-solid fa-arrow-right"></i></button></div></section>
    <section id="dashboard" class="screen"><header class="topbar"><div class="brand">🌊 물들자</div><div class="right-tools"><button class="points" onclick="showPoints()"><i class="fa-solid fa-coins"></i> <span id="points">0</span>P</button><button class="shop" onclick="show('shopScreen')"><i class="fa-solid fa-bag-shopping"></i> 쇼핑</button></div></header><div class="welcome"><h2>오늘, 바다를 위해 알아볼까요?</h2><p>짧은 콘텐츠를 보고 친환경 행동을 시작해요.</p></div><div class="progress"><span id="progressText">학습 진행도 0 / 4</span><div class="bar"><div id="progressBar"></div></div></div><div class="menu"><button class="card video" data-id="video" onclick="openContent('video')"><i class="fa-solid fa-circle-play"></i><h3>영상</h3><span>랜덤 미세플라스틱 영상</span></button><button class="card article" data-id="article" onclick="openContent('article')"><i class="fa-solid fa-book-open"></i><h3>글</h3><span>플라스틱의 긴 여행</span></button><button class="card guide" data-id="guide" onclick="openContent('guide')"><i class="fa-solid fa-seedling"></i><h3>사용 설명서</h3><span>오늘의 친환경 실천</span></button><button class="card comic" data-id="comic" onclick="openContent('comic')"><i class="fa-solid fa-images"></i><h3>만화 / 그림</h3><span>바다거북의 부탁</span></button></div></section>
    <section id="content" class="screen"><article class="box"><button class="back" onclick="show('dashboard')"><i class="fa-solid fa-arrow-left"></i> 메뉴로</button><div id="body"></div><div id="status" class="notice"></div><button id="videoCheck" class="verify" style="display:none" onclick="confirmVideo()">영상 끝까지 시청했어요</button><button class="complete" onclick="finishContent()">이 콘텐츠 다 봤어요</button></article></section>
    <section id="shopScreen" class="screen"><div class="box shop-box"><div class="coin">🛍️</div><h2>포인트 쇼핑</h2><p>현재 보유 포인트<br><strong style="font-size:28px;color:#1976d2"><span id="shopPoints">0</span>P</strong></p><div class="text product">🍬 <strong>마이쮸 1개</strong><br>500P로 교환할 수 있어요.<br><span class="muted">교환 기능은 다음 단계에서 연결합니다.</span></div><button class="back" style="margin-top:20px" onclick="show('dashboard')">메뉴로 돌아가기</button></div></section>
  </main>
  <script>
    const content={
      video:{type:'영상',title:'오늘의 랜덤 미세플라스틱 영상',body:'<div class="youtube"><iframe id="videoFrame" title="미세플라스틱 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="text">아래 영상은 팀이 고른 4개 중 하나입니다. 재생 오류가 나면 바로 아래의 “YouTube에서 영상 열기”를 눌러 시청해 주세요.</div><a id="youtubeLink" class="external" target="_blank" rel="noopener">YouTube에서 영상 열기 <i class="fa-solid fa-arrow-up-right-from-square"></i></a>'},
      article:{type:'글',title:'플라스틱의 긴 여행',body:'<div class="text">일회용 컵 하나는 잠깐 쓰이지만 자연에서는 아주 오랫동안 남아 있을 수 있어요. 필요한 물건은 오래 쓰고, 다시 사용할 수 있는 물건을 고르는 것이 바다를 지키는 첫걸음입니다.</div>'},
      guide:{type:'사용 설명서',title:'오늘의 친환경 실천 3가지',body:'<ol class="tips"><li><strong>텀블러</strong>를 사용해 일회용 컵 줄이기</li><li>쓰레기를 <strong>종류별로 분리배출</strong>하기</li><li>바닷가에서는 내 쓰레기를 <strong>다시 가져오기</strong></li></ol>'},
      comic:{type:'만화 / 그림',title:'바다거북의 부탁',body:'<div class="text" style="text-align:center;font-size:36px">🐢<br>“깨끗한 바다는 모두의 집이에요!” 🌊</div><p>작은 플라스틱 조각을 먹이로 착각하는 바다거북도 있어요. 우리가 쓰레기를 줄이면 바다 친구들을 도울 수 있습니다.</p>'}
    };
    const videoIds=['Gnirt72aX5s','91bytoQkBT8','Yw2dy0E9tAo','X1tZMOwvtV8'];
    const readingIds=['article','guide','comic']; let current='';let seconds=0;let timer;let videoConfirmed=false;
    let points=Number(localStorage.getItem('muldeuljaPoints')||0);let done=new Set(JSON.parse(localStorage.getItem('muldeuljaDone')||'[]'));
    function show(id){clearInterval(timer);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='dashboard')update();if(id==='shopScreen')document.getElementById('shopPoints').textContent=points}
    function openContent(id){clearInterval(timer);current=id;seconds=0;videoConfirmed=false;const c=content[id];document.getElementById('body').innerHTML=`<div class="type">${c.type}</div><h2>${c.title}</h2>${c.body}`;document.getElementById('videoCheck').style.display=id==='video'?'block':'none';if(id==='video'){const chosen=videoIds[Math.floor(Math.random()*videoIds.length)];document.getElementById('videoFrame').src=`https://www.youtube-nocookie.com/embed/${chosen}?rel=0`;document.getElementById('youtubeLink').href=`https://www.youtube.com/watch?v=${chosen}`;document.getElementById('status').textContent='영상을 끝까지 본 뒤, “영상 끝까지 시청했어요”를 눌러 확인해 주세요.'}else if(done.has(id)){document.getElementById('status').textContent='이미 100P를 받은 콘텐츠예요. 다시 학습할 수 있어요!'}else{readingStatus();timer=setInterval(()=>{seconds++;readingStatus();if(seconds>=60)clearInterval(timer)},1000)}show('content')}
    function readingStatus(){const left=Math.max(60-seconds,0);document.getElementById('status').textContent=left?`읽는 중 ${seconds}초 · 포인트 조건까지 ${left}초 남음`:'60초 읽기 완료! 완료 버튼을 누르면 100P를 받아요.'}
    function confirmVideo(){videoConfirmed=true;document.getElementById('status').textContent='시청 완료로 확인했어요. 완료 버튼을 누르면 100P를 받아요.';document.getElementById('videoCheck').style.display='none'}
    function finishContent(){let msg='메뉴 화면으로 돌아갑니다.';if(done.has(current))msg='이미 포인트를 받은 콘텐츠예요. 다시 학습해 줘서 고마워요!';else if(readingIds.includes(current)&&seconds<60)msg=`아직 ${60-seconds}초 더 읽어야 포인트를 받을 수 있어요.`;else if(current==='video'&&!videoConfirmed)msg='영상을 끝까지 시청한 뒤 시청 완료 확인 버튼을 눌러 주세요.';else{done.add(current);points+=100;localStorage.setItem('muldeuljaPoints',points);localStorage.setItem('muldeuljaDone',JSON.stringify([...done]));msg='100P 지급 완료! 메뉴 화면으로 돌아갑니다.'}alert(msg);show('dashboard')}
    function update(){document.getElementById('points').textContent=points;document.getElementById('progressText').textContent=`학습 진행도 ${done.size} / 4`;document.getElementById('progressBar').style.width=`${done.size*25}%`;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('done',done.has(c.dataset.id)))}
    function showPoints(){alert(`현재 보유 포인트는 ${points}P입니다.`)}
    update();
  </script>
</body>
</html>
